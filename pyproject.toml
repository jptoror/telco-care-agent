[project]
name = "telco-care-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.61",
    "bedrock-agentcore[strands-agents]>=1.24",
    "mcp>=1.23,<2",
    "boto3",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["agent", "tools"]
